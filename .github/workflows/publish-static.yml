name: Build static application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: static-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: 'true'
      - run: npm run build
        env:
          CI: 'true'
          PUBLIC_URL: /clue
      - name: Record build identity and file hashes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node .github/scripts/package-static.mjs
      - name: Upload static output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-clue
          path: build/
          if-no-files-found: error
          retention-days: 14

  notify:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'troyeagle/larp-clues-presentation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Notify the blog synchronizer
        env:
          BLOG_DISPATCH_TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.BLOG_DISPATCH_TOKEN;
          if (!token) {
            console.log('::notice::Static artifact is ready. BLOG_DISPATCH_TOKEN is not configured; the blog can collect it by schedule or manual dispatch.');
            process.exit(0);
          }
          const url = 'https://api.github.com/repos/troyeagle/troyeagle.github.io/actions/workflows/sync-apps.yml/dispatches';
          for (let attempt = 1; attempt <= 3; attempt++) {
            const response = await fetch(url, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ ref: 'master', inputs: { dry_run: 'false' } }),
            });
            if (response.ok) { console.log('Blog synchronization requested.'); process.exit(0); }
            if (attempt === 3) throw new Error(`Blog dispatch failed (HTTP ${response.status}); the build artifact remains available.`);
            await new Promise(resolve => setTimeout(resolve, attempt * 2000));
          }
          JS
