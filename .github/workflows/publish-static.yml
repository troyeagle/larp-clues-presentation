name: Deploy project Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-pages-${{ github.ref }}
  cancel-in-progress: false

# Default for a public repository is project Pages. To move to a private source,
# follow STATIC_PUBLISH.md and select SITE_PUBLISH_MODE=blog explicitly.
jobs:
  build:
    name: Build project site
    if: vars.SITE_PUBLISH_MODE != 'blog' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run application checks
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: 'true'
      - name: Build project site
        run: npm run build
        env:
          CI: 'true'
          PUBLIC_URL: /larp-clues-presentation
          GENERATE_SOURCEMAP: 'false'
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build
          retention-days: 1

  deploy:
    name: Deploy project site
    if: vars.SITE_PUBLISH_MODE != 'blog' && !github.event.repository.private && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
